# Pins the Rust toolchain so every machine compiles the Tauri shell identically.
# rustup reads this automatically — no manual `rustup override` needed.
#
# Pinned at phase 1 from the machine that scaffolded the app (rustc 1.97.1, released 2026-07-14).
# Bump deliberately, not incidentally: clippy gains lints between releases and CI fails on
# warnings, so a floating channel turns an unrelated commit red.

[toolchain]
channel = "1.97.1"
components = ["rustfmt", "clippy"]
targets = ["x86_64-pc-windows-msvc"]
profile = "default"
